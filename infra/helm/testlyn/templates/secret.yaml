# Sensitive env vars are expected to be provided externally (Secret Manager via
# external-secrets operator, or manually created Secret before helm install).
# This template creates an empty placeholder Secret that deployments reference.
# Populate via: kubectl create secret generic testlyn-secrets --from-env-file=.env
apiVersion: v1
kind: Secret
metadata:
  name: testlyn-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "testlyn.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
# Keys expected (populate externally — never commit values):
# DATABASE_URL, REDIS_URL, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
# SENDGRID_API_KEY, TESTLYN_LICENSE_KEY
stringData: {}
