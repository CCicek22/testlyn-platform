{{- range $comp, $cfg := dict "api" .Values.api "web" .Values.web "engine" .Values.engine "report-builder" .Values.reportBuilder }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: testlyn-{{ $comp }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "testlyn.labels" $ | nindent 4 }}
    component: {{ $comp }}
  {{- if $.Values.workloadIdentity.enabled }}
  annotations:
    iam.gke.io/gcp-service-account: {{ $cfg.serviceAccount.gcpServiceAccount }}
  {{- end }}
{{- end }}
