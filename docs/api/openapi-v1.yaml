components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    InviteCreate:
      properties:
        email:
          type: string
          format: email
          title: Email
        role:
          type: string
          title: Role
          default: member
      type: object
      required:
      - email
      title: InviteCreate
    InviteOut:
      properties:
        org_id:
          type: string
          format: uuid
          title: Org Id
        email:
          type: string
          title: Email
        role:
          type: string
          title: Role
        message:
          type: string
          title: Message
          default: Invite recorded (email delivery stubbed for Phase 1)
      type: object
      required:
      - org_id
      - email
      - role
      title: InviteOut
    OrgCreate:
      properties:
        name:
          type: string
          title: Name
      type: object
      required:
      - name
      title: OrgCreate
    OrgMembershipOut:
      properties:
        org_id:
          type: string
          format: uuid
          title: Org Id
        role:
          type: string
          title: Role
      type: object
      required:
      - org_id
      - role
      title: OrgMembershipOut
    OrgOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        slug:
          type: string
          title: Slug
        plan:
          type: string
          title: Plan
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - name
      - slug
      - plan
      - created_at
      title: OrgOut
    ProjectCreate:
      properties:
        name:
          type: string
          title: Name
      type: object
      required:
      - name
      title: ProjectCreate
    ProjectOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        org_id:
          type: string
          format: uuid
          title: Org Id
        name:
          type: string
          title: Name
        slug:
          type: string
          title: Slug
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - org_id
      - name
      - slug
      - created_at
      title: ProjectOut
    RunCompletePayload:
      properties:
        exit_code:
          type: integer
          title: Exit Code
        summary_uri:
          anyOf:
          - type: string
          - type: 'null'
          title: Summary Uri
        error_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Reason
      type: object
      required:
      - exit_code
      title: RunCompletePayload
    RunCreate:
      properties: {}
      type: object
      title: RunCreate
    RunOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        test_id:
          type: string
          format: uuid
          title: Test Id
        product:
          type: string
          title: Product
        state:
          type: string
          title: State
        runner_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Runner Id
        region:
          type: string
          title: Region
        started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started At
        finished_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Finished At
        summary_uri:
          anyOf:
          - type: string
          - type: 'null'
          title: Summary Uri
        error_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Reason
        triggered_by:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Triggered By
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - test_id
      - product
      - state
      - runner_id
      - region
      - started_at
      - finished_at
      - summary_uri
      - error_reason
      - triggered_by
      - created_at
      - updated_at
      title: RunOut
    ScheduleCreate:
      properties:
        cron:
          type: string
          title: Cron
        timezone:
          type: string
          title: Timezone
          default: UTC
      type: object
      required:
      - cron
      title: ScheduleCreate
    ScheduleOut:
      properties:
        id:
          type: string
          title: Id
        test_id:
          type: string
          title: Test Id
        org_id:
          type: string
          title: Org Id
        cron:
          type: string
          title: Cron
        timezone:
          type: string
          title: Timezone
        local:
          type: boolean
          title: Local
      type: object
      required:
      - id
      - test_id
      - org_id
      - cron
      - timezone
      - local
      title: ScheduleOut
    TargetCreate:
      properties:
        name:
          type: string
          title: Name
        kind:
          $ref: '#/components/schemas/TargetKind'
        base_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Base Url
        auth_config:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Auth Config
      type: object
      required:
      - name
      - kind
      title: TargetCreate
    TargetKind:
      type: string
      enum:
      - web
      - mobile
      - api
      title: TargetKind
    TargetListOut:
      properties:
        items:
          items:
            $ref: '#/components/schemas/TargetOut'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        cursor:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Cursor
      type: object
      required:
      - items
      - total
      - cursor
      title: TargetListOut
    TargetOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        org_id:
          type: string
          format: uuid
          title: Org Id
        name:
          type: string
          title: Name
        kind:
          $ref: '#/components/schemas/TargetKind'
        base_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Base Url
        auth_config:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Auth Config
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - org_id
      - name
      - kind
      - base_url
      - auth_config
      - created_at
      - updated_at
      title: TargetOut
    TargetUpdate:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        kind:
          anyOf:
          - $ref: '#/components/schemas/TargetKind'
          - type: 'null'
        base_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Base Url
        auth_config:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Auth Config
      type: object
      title: TargetUpdate
    TestConfig:
      properties:
        vus:
          type: integer
          title: Vus
          default: 1
