  /v1/orgs/{org_id}/targets:
    get:
      tags:
      - targets
      summary: List Targets
      operationId: list_targets_v1_orgs__org_id__targets_get
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Org Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: After
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetListOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
