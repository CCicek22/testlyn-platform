[project]
name = "testlyn-engine-a11y"
version = "0.1.0"
description = "Testlyn engine-a11y: axe-core parser and tooling"
requires-python = ">=3.13"
dependencies = [
    # The sidecar package ships the BQ streaming pipeline.
    # In production it is installed from Artifact Registry (see Dockerfile ARG).
    # For local dev it is editable-installed from apps/engine/sidecar/.
    "testlyn-sidecar>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv.sources]
testlyn-sidecar = { path = "../engine/sidecar", editable = true }

[tool.uv.workspace]
members = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
