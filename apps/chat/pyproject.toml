[project]
name = "testlyn-chat"
version = "0.1.0"
description = "Testlyn chat service — coordinator agent + product sub-agents (Google ADK 2.0 beta)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.44.0",
    "pydantic>=2.13.2",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.1",
    "structlog>=25.3.0",
    "firebase-admin>=7.4.0",
    "redis>=5.0.0",
    "google-adk==2.0.0a1",
    "google-cloud-aiplatform>=1.70.0",
    "google-genai>=1.0.0",
    "sse-starlette>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=6.0.0",
    "respx>=0.21.1",
    "ruff>=0.11.0",
    "mypy>=1.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["testlyn_chat"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff.lint]
extend-ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["tests/"]
