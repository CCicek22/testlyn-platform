[project]
name = "testlyn-cli"
version = "0.1.0"
description = "Testlyn developer CLI"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
]

[project.scripts]
testlyn = "testlyn.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["testlyn"]
