[project]
name = "testlyn-api"
version = "0.1.0"
description = "Testlyn FastAPI backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.44.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.13.2",
    "pydantic-settings>=2.7.0",
    "firebase-admin>=7.4.0",
    "google-cloud-tasks>=2.17.0",
    "google-cloud-storage>=3.10.1",
    "google-cloud-bigquery>=3.27.0",
    "google-cloud-run>=0.10.0",
    "google-cloud-aiplatform>=1.70.0",
    "google-cloud-scheduler>=2.14.0",
    "redis>=5.0.0",
    "stripe>=10.0.0",
    "croniter>=2.0.0",
    "httpx>=0.28.1",
    "strawberry-graphql[fastapi]>=0.243.0",
    "structlog>=25.3.0",
    "python-multipart>=0.0.26",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.1",
    "ruff>=0.11.0",
    "mypy>=1.15.0",
    "aiosqlite>=0.21.0",
    "fakeredis>=2.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["testlyn_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff.lint]
# B008: FastAPI canonical pattern is `param: T = Query(...)` — false positive here.
extend-ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest-timeout>=2.4.0",
]
