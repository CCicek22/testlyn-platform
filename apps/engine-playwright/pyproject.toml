[project]
name = "testlyn-engine-playwright"
version = "0.1.0"
description = "Playwright engine container — sidecar re-exports + parser plugin"
requires-python = ">=3.13"
dependencies = [
    "google-cloud-bigquery>=3.27",
    "pydantic>=2",
    "pydantic-settings>=2",
    "structlog>=25.3",
    "tenacity>=9.1",
    "aiohttp>=3.11",
    "aiofiles>=24.1",
]

[tool.uv.workspace]
members = []

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
