name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0

      - name: Install workspace dependencies
        run: uv sync --all-packages --all-extras --frozen

      - name: API tests
        working-directory: apps/api
        run: uv run --frozen pytest

      - name: Engine sidecar tests
        working-directory: apps/engine
        run: uv run --frozen pytest sidecar

      - name: Report builder tests
        working-directory: apps/report-builder
        run: uv run --frozen pytest

      - name: Locator healer tests
        working-directory: apps/locator-healer
        run: |
          uv sync --frozen --all-extras
          uv run --frozen pytest

  postgres:
    name: Postgres tests (pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: testlyn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testlyn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0

      - name: Install workspace dependencies
        run: uv sync --all-packages --all-extras --frozen

      - name: Migrations and Postgres-only tests
        working-directory: apps/api
        env:
          TEST_POSTGRES_URL: postgresql+asyncpg://postgres:ci-only@127.0.0.1:5432/testlyn_test
        run: uv run --frozen pytest -m postgres

  web:
    name: Web typecheck, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck shared and ui packages
        run: pnpm --filter @testlyn/shared --filter @testlyn/ui run typecheck

      - name: Typecheck web app
        run: pnpm --filter @testlyn/web run typecheck

      - name: Lint web app
        run: pnpm --filter @testlyn/web run lint

      - name: Unit tests
        run: pnpm --filter @testlyn/web run test
